<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopMatch AI - Experience Pop Culture Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0b0f19; 
            color: #f3f4f6; 
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.15) 0%, transparent 50%);
        }
        .glass-panel { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(14px); 
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .grid-tile { 
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s, box-shadow 0.15s; 
            user-select: none;
        }
        .grid-tile:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }
        .grid-tile:active {
            transform: scale(0.95);
        }
        .grid-tile.tile-selected {
            outline: 2px solid #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transform: scale(1.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 overflow-x-hidden">

    <!-- Top Status Bar & Trending Signal Banner -->
    <div class="w-full max-w-md glass-panel rounded-2xl p-4 mb-4 flex justify-between items-center shadow-2xl">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-fuchsia-500 bg-clip-text text-transparent">POPMATCH AI</h1>
            <p class="text-xs text-gray-400 mt-0.5">Live Event: <span class="text-fuchsia-400 font-semibold" id="event-banner">Drama Alert Active</span></p>
        </div>
        <div class="text-right">
            <span class="text-xs text-gray-400 uppercase tracking-widest block">Score</span>
            <span class="text-2xl font-black text-cyan-400" id="game-score">000,000</span>
        </div>
    </div>

    <!-- Central Interactive Match Grid Canvas Sandbox -->
    <div class="w-full max-w-md aspect-square glass-panel rounded-3xl p-3 relative shadow-2xl">
        <div id="game-board-matrix" class="w-full h-full grid grid-cols-4 grid-rows-4 gap-3 bg-gray-950/50 rounded-2xl p-2 border border-white/5">
            <!-- Dynamic Tiles will be programmatically generated here by game.js -->
        </div>
        
        <!-- Camera Flash Overlay Effect Mask -->
        <div id="dopamine-flash-mask" class="absolute inset-0 bg-white opacity-0 rounded-3xl pointer-events-none transition-opacity duration-75"></div>
    </div>

    <!-- Real-Time Metrics & Controls Dock -->
    <div class="w-full max-w-md mt-4 grid grid-cols-2 gap-3">
        <div class="glass-panel rounded-2xl p-3 text-center">
            <span class="text-xs text-gray-400 block">Pity Progress</span>
            <span class="text-lg font-bold text-amber-400" id="pity-counter">0 / 80</span>
        </div>
        <button id="btn-gacha-pull" onclick="triggerGachaPull()" class="glass-panel rounded-2xl p-3 text-center font-bold tracking-wide hover:bg-white/5 active:scale-95 transition-all text-fuchsia-400 border border-fuchsia-500/20">
            ✨ Pull Gacha
        </button>
    </div>

    <script src="game.js"></script>
</body>
</html>
